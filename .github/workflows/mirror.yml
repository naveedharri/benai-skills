name: Mirror to private repo

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'naveedharri/benai-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Clone source as a bare mirror
        run: git clone --mirror "https://github.com/${{ github.repository }}.git" source.git

      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.MIRROR_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Push all branches and tags to the mirror
        working-directory: source.git
        run: |
          git for-each-ref --format='%(refname)' refs/pull | xargs -r -n1 git update-ref -d
          git push --prune git@github.com:naveedharri/benai-skills-mirror.git \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
