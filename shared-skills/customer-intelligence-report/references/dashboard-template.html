<!DOCTYPE html>
<!-- BenAI instant-ui v1 -->
<!--
  CUSTOMER INTELLIGENCE REPORT  -  instant-ui, data-driven dashboard template
  ===========================================================================
  Self-contained, single-file, offline. Renders entirely from the
  WEEKS and LEXICON arrays near the bottom of this file. Change the data, the
  whole report changes. Nothing is hardcoded.

  Aesthetic: BenAI instant-ui neo-brutalist design language
  (see references/instant-ui/design-tokens.md and build-rules.md).
    cream #fffef8 canvas, near-black ink, 3px hard borders, 6px zero-blur
    shadows, square corners, 4px blue/green/amber gradient stripe on top,
    system font plus SF Mono for every number and label, weight-900 headings.

  HOW TO USE
    1. Edit the SECTIONS config to name/order the sections you want (customizable).
    2. Replace the WEEKS and LEXICON assignments with your real JSON (see
       references/data-schema.md). Replace the WHOLE assignment line, do not leave
       a trailing `[]`.
    3. Set the REPORT_TITLE and RECURRING_WINDOW constants.
    4. Save as customer-intelligence-report-YYYY-MM-DD.html and open it.
    5. Never invent numbers or quotes. Every figure traces to a real source result.
    6. No em dashes anywhere in the rendered copy.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Intelligence Report | BenAI</title>
<style>
  :root {
    /* Backgrounds */
    --bg: #fffef8;           /* Cream - primary page background */
    --bg-alt: #f8fafc;       /* Slate-50 - alternating section bg */

    /* Ink + text */
    --ink: #111;             /* Near-black - headings, borders, shadows */
    --text: #444;            /* Primary body text */
    --text-light: #666;      /* Secondary text */
    --text-muted: #999;      /* Meta, labels, dim emphasis */

    /* Accents (use sparingly, never dilute) */
    --accent: #2563eb;       /* Blue - primary accent */
    --accent-dark: #1d4ed8;
    --accent-pale: #dbeafe;  /* Pale blue card background */

    --green: #16a34a;        /* Success / positive */
    --green-pale: #dcfce7;

    --amber: #d97706;        /* Warning / attention */
    --amber-pale: #fef3c7;

    --yellow-pale: #fef9c3;  /* Soft highlights */

    --red: #dc2626;          /* Error / problem */
    --red-pale: #fee2e2;

    /* Borders + shadows (the brutalist signature) */
    --border: #111;                /* Always hard near-black */
    --border-light: #e5e7eb;       /* Rare, internal dividers only */
    --shadow: 6px 6px 0 #111;      /* Hard drop shadow - no blur */
    --shadow-sm: 4px 4px 0 #111;
    --shadow-xs: 3px 3px 0 #111;

    /* Typography */
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", "Fira Code", Menlo, monospace;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  strong { font-weight: 700; color: var(--ink); }

  /* Signature top stripe - every BenAI page gets this */
  .top-stripe {
    height: 4px;
    background: linear-gradient(90deg, #3b82f6, #22c55e, #f59e0b);
    position: sticky;
    top: 0;
    z-index: 1001;
  }

  /* Header */
  .site-header {
    position: sticky; top: 4px; height: 64px;
    background: var(--ink); z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; border-bottom: 3px solid var(--border);
  }
  .header-brand { display: flex; align-items: center; gap: 16px; }
  .header-brand .smiley { width: 30px; height: 30px; color: #fffef8; }
  .header-brand .brand-name { color: #fffef8; font-size: 17px; font-weight: 900; letter-spacing: -0.01em; }
  .header-divider { width: 2px; height: 24px; background: rgba(255,255,255,0.2); }
  .header-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; text-transform: uppercase; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 48px 28px 72px; }

  /* Report header */
  .report-head { margin-bottom: 36px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; font-weight: 900;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: 2px solid var(--border); background: #fff;
    padding: 6px 14px; box-shadow: var(--shadow-xs);
  }
  .pill .dot { width: 8px; height: 8px; background: var(--accent); }
  .titlerow { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-top: 20px; }
  h1 { font-size: 56px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.02; }
  .report-head .meta { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--text-light); letter-spacing: 0.04em; }
  .report-head .meta strong { display: block; color: var(--ink); font-size: 14px; font-weight: 900; }

  .nav { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .nav button {
    font-family: var(--mono); font-size: 11px; font-weight: 900;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); background: #fff;
    border: 2px solid var(--border); box-shadow: var(--shadow-xs);
    padding: 9px 16px; cursor: pointer;
  }
  .nav button:hover:not(:disabled) { background: var(--yellow-pale); }
  .nav button:active:not(:disabled) { box-shadow: none; transform: translate(3px, 3px); }
  .nav button:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .nav .period { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-light); padding: 0 6px; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
  .kpi { background: #fff; border: 3px solid var(--border); box-shadow: var(--shadow-sm); padding: 22px 24px; }
  .kpi .n { font-family: var(--mono); font-size: 44px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
  .kpi .l { font-family: var(--mono); font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-top: 10px; }

  /* Sections */
  .section { margin-bottom: 32px; }
  .section-title { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .section-title h2 { font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
  .section-title .count { margin-left: auto; font-family: var(--mono); font-size: 10px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); background: var(--yellow-pale); border: 2px solid var(--border); padding: 4px 10px; }

  /* Theme cards */
  .themegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .theme { background: #fff; border: 3px solid var(--border); box-shadow: var(--shadow-sm); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
  .theme .thead { display: flex; align-items: flex-start; gap: 10px; }
  .theme .title { font-size: 18px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.25; flex: 1; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-family: var(--mono); font-size: 9px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border: 2px solid var(--border); white-space: nowrap; }
  .badge.streak   { background: var(--accent-pale); }
  .badge.resolved { background: var(--green-pale); }
  .badge.open     { background: var(--amber-pale); }
  .badge.freq     { background: var(--bg-alt); }
  .theme .summary { font-size: 14px; color: var(--text); line-height: 1.55; }
  .theme .members { font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; color: var(--text-light); }
  .theme .members b { color: var(--ink); font-weight: 700; }
  .evidence { border-top: 2px solid var(--border-light); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .quote { background: var(--bg); border: 2px solid var(--border); padding: 11px 13px; }
  .quote .q { font-size: 13px; color: var(--ink); line-height: 1.5; font-style: italic; }
  .quote .src { margin-top: 7px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .src .tag { font-family: var(--mono); font-size: 9px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border: 2px solid var(--border); color: var(--ink); }
  .tag.fireflies { background: var(--amber-pale); }
  .tag.circle    { background: var(--accent-pale); }
  .tag.other     { background: var(--bg-alt); }

  /* Stuck members */
  .section.card { background: #fff; border: 3px solid var(--border); box-shadow: var(--shadow); padding: 28px; }
  .stuck { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 2px solid var(--border-light); }
  .stuck:last-child { border-bottom: 0; }
  .stuck .wk { font-family: var(--mono); font-size: 24px; font-weight: 900; color: var(--amber); min-width: 52px; text-align: center; }
  .stuck .wk small { display: block; font-family: var(--mono); font-size: 8px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .stuck .who b { display: block; font-size: 14px; font-weight: 900; color: var(--ink); }
  .stuck .who span { font-size: 12.5px; color: var(--text-light); }
  .empty { font-size: 13.5px; color: var(--text-muted); padding: 8px 0; }

  footer { margin-top: 56px; text-align: center; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  footer .smiley { width: 24px; height: 24px; color: var(--ink); display: block; margin: 0 auto 12px; }

  @media (max-width: 980px) {
    .wrap { padding: 40px 20px 64px; }
    h1 { font-size: 36px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .themegrid { grid-template-columns: 1fr; }
    .report-head .meta { text-align: left; }
  }
  @media (max-width: 720px) {
    .site-header { padding: 0 16px; height: 60px; }
    .header-brand .brand-name { font-size: 15px; }
    .header-divider, .header-title { display: none; }
    .kpis { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="top-stripe"></div>

<header class="site-header">
  <div class="header-brand">
    <svg class="smiley" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="3" fill="none"/>
      <circle cx="17" cy="18" r="2.5" fill="currentColor"/>
      <circle cx="31" cy="18" r="2.5" fill="currentColor"/>
      <path d="M14 30 C14 30 18 36 24 36 C30 36 34 30 34 30" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="brand-name">BenAI</span>
    <div class="header-divider"></div>
    <span class="header-title">Customer Intelligence</span>
  </div>
</header>

<div class="wrap">
  <div class="report-head">
    <span class="pill"><span class="dot"></span><span id="eyebrow">CUSTOMER INTELLIGENCE</span></span>
    <div class="titlerow">
      <h1 id="title">Customer Intelligence Report</h1>
      <div class="meta"><strong id="scope"></strong><span id="subtitle"></span></div>
    </div>
    <div class="nav">
      <button id="prev">&larr; Previous</button>
      <span class="period" id="period"></span>
      <button id="next">Next &rarr;</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="sections"></div>
  <footer>
    <svg class="smiley" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="3" fill="none"/>
      <circle cx="17" cy="18" r="2.5" fill="currentColor"/>
      <circle cx="31" cy="18" r="2.5" fill="currentColor"/>
      <path d="M14 30 C14 30 18 36 24 36 C30 36 34 30 34 30" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
    <div id="footer"></div>
  </footer>
</div>

<script>
/* =========================================================================
   CONFIG  -  edit these to customize the report (see references/report-config.md)
   ========================================================================= */
const REPORT_TITLE   = "Customer Intelligence Report"; // FILL
const REPORT_EYEBROW = "CUSTOMER INTELLIGENCE";        // FILL: scope tag, e.g. "TEAM DELTA - WEEKLY"
const REPORT_SCOPE   = "";                             // FILL: e.g. "All meetings" / "Sarah Chen" / "Sales team"
const REPORT_SOURCES = "Fireflies meetings + Circle posts";// FILL: sources analyzed
const RECURRING_WINDOW = 4; // how many trailing periods count toward "recurring"

// Section catalog. Order here = render order. Add/rename freely; any theme whose
// `section` matches an `id` renders under that section. Themes with an unknown
// section still render under an auto-created "Other" section so nothing is lost.
const SECTIONS = [
  { id: "pain-points",  title: "Pain points" },
  { id: "tech-patterns", title: "Technical patterns" }
  // e.g. add: { id: "feature-requests", title: "Feature requests" }
];

/* =========================================================================
   DATA  -  replace both assignments with real JSON (see references/data-schema.md)
   ========================================================================= */
let WEEKS = [/* FILL: array of period objects, oldest first */];
let LEXICON = [/* FILL: controlled vocabulary entries */];

/* =========================================================================
   RENDER  -  no need to edit below this line
   ========================================================================= */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { const p=String(d||"").split("-"); if(p.length!==3) return esc(d); const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return `${+p[2]} ${m[+p[1]-1]} ${p[0]}`; };
const fmtRange = (a,b) => `${fmtDate(a)} to ${fmtDate(b)}`;
const srcTag = s => s==="fireflies"?"fireflies":s==="circle"?"circle":"other";

let currentIdx = WEEKS.length - 1; // start on newest

function recurringThemes(uptoIdx){
  // themes appearing in >= 2 of the trailing RECURRING_WINDOW periods, ranked by streak then frequency
  const start = Math.max(0, uptoIdx - RECURRING_WINDOW + 1);
  const seen = new Map();
  for(let i=start;i<=uptoIdx;i++){
    (WEEKS[i]?.themes||[]).forEach(t=>{
      const cur = seen.get(t.id) || {theme:t, periods:0, freq:0};
      cur.periods += 1; cur.freq += (t.frequency||0); cur.theme = t; // keep latest
      seen.set(t.id, cur);
    });
  }
  return [...seen.values()].filter(x=>x.periods>=2)
    .sort((a,b)=>(b.theme.streak||0)-(a.theme.streak||0)||b.freq-a.freq)
    .map(x=>x.theme);
}

function themeCard(t){
  const badges = [];
  if((t.streak||0)>=2) badges.push(`<span class="badge streak">${esc(t.streak)}w streak</span>`);
  badges.push(`<span class="badge freq">${esc((t.calls_count||0))} calls${(t.posts_count?` · ${esc(t.posts_count)} posts`:"")}</span>`);
  badges.push(t.resolved?`<span class="badge resolved">Resolved</span>`:`<span class="badge open">Open</span>`);
  const members = (t.members&&t.members.length)?`<div class="members"><b>Raised by:</b> ${t.members.map(esc).join(", ")}</div>`:"";
  const evidence = (t.evidence&&t.evidence.length)?`<div class="evidence">${t.evidence.map(e=>`
      <div class="quote"><div class="q">${esc(e.quote)}</div>
        <div class="src"><span class="tag ${srcTag(e.source)}">${esc(e.source||"source")}</span>${esc(e.member||"")}</div></div>`).join("")}</div>`:"";
  return `<div class="theme">
    <div class="thead"><div class="title">${esc(t.title)}</div></div>
    <div class="badges">${badges.join("")}</div>
    <div class="summary">${esc(t.summary)}</div>
    ${members}${evidence}
  </div>`;
}

function sectionBlock(title, themes, countLabel){
  const body = themes.length
    ? `<div class="themegrid">${themes.map(themeCard).join("")}</div>`
    : `<div class="empty">No ${esc(title.toLowerCase())} this period.</div>`;
  return `<div class="section"><div class="section-title"><h2>${esc(title)}</h2>
    <span class="count">${esc(countLabel!=null?countLabel:themes.length)}</span></div>${body}</div>`;
}

function render(){
  const w = WEEKS[currentIdx];
  document.getElementById("title").textContent = REPORT_TITLE;
  document.getElementById("eyebrow").textContent = REPORT_EYEBROW;
  document.getElementById("scope").textContent = REPORT_SCOPE || "";
  document.getElementById("subtitle").textContent = REPORT_SOURCES;
  document.title = REPORT_TITLE + " | BenAI";

  if(!w){ document.getElementById("sections").innerHTML = `<div class="section card"><div class="empty">No data for this period.</div></div>`; return; }
  document.getElementById("period").textContent = `${w.week_of_month?w.week_of_month+" · ":""}${fmtRange(w.week_start,w.week_end)}`;
  document.getElementById("prev").disabled = currentIdx<=0;
  document.getElementById("next").disabled = currentIdx>=WEEKS.length-1;

  // KPIs
  const themes = w.themes||[];
  const recurring = recurringThemes(currentIdx);
  const kpis = [
    {n:w.calls_processed||0, l:"Meetings analyzed"},
    {n:themes.length, l:"Themes surfaced"},
    {n:recurring.length, l:`Recurring (${RECURRING_WINDOW}p)`},
    {n:(w.stuck_members||[]).length, l:"Members to help"}
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k=>`<div class="kpi"><div class="n">${esc(k.n)}</div><div class="l">${esc(k.l)}</div></div>`).join("");

  // Sections: recurring first, then each configured section, then any unknown-section themes, then stuck members
  let html = "";
  html += sectionBlock(`Recurring themes (last ${RECURRING_WINDOW} periods)`, recurring, recurring.length);
  const known = new Set(SECTIONS.map(s=>s.id));
  SECTIONS.forEach(sec=>{
    html += sectionBlock(sec.title, themes.filter(t=>t.section===sec.id));
  });
  const orphans = themes.filter(t=>!known.has(t.section));
  if(orphans.length) html += sectionBlock("Other", orphans);

  const stuck = w.stuck_members||[];
  const stuckBody = stuck.length
    ? stuck.slice().sort((a,b)=>(b.weeks_stuck||0)-(a.weeks_stuck||0)).map(s=>`
        <div class="stuck"><div class="wk">${esc(s.weeks_stuck||0)}<small>weeks</small></div>
          <div class="who"><b>${esc(s.member)}</b><span>Stuck on: ${esc(s.theme)}${s.first_seen?` · since ${fmtDate(s.first_seen)}`:""}</span></div></div>`).join("")
    : `<div class="empty">No members flagged as stuck this period.</div>`;
  html += `<div class="section card"><div class="section-title"><h2>Members to help</h2><span class="count">${stuck.length}</span></div>${stuckBody}</div>`;

  document.getElementById("sections").innerHTML = html;
  document.getElementById("footer").textContent = `Generated by the Customer Intelligence Report skill · source: ${REPORT_SOURCES} · ${WEEKS.length} periods tracked`;
}

document.getElementById("prev").onclick = ()=>{ if(currentIdx>0){currentIdx--;render();} };
document.getElementById("next").onclick = ()=>{ if(currentIdx<WEEKS.length-1){currentIdx++;render();} };
render();
</script>
</body>
</html>
