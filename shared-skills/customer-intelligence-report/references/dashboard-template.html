<!DOCTYPE html>
<!--
  CUSTOMER INTELLIGENCE REPORT  -  soft-UI, data-driven dashboard template
  =========================================================================
  Self-contained, single-file, offline, theme-aware. Renders entirely from the
  WEEKS and LEXICON arrays near the bottom of this file. Change the data, the
  whole report changes. Nothing is hardcoded.

  Aesthetic: Soft Structuralism (see the soft-ui / high-end-visual-design skill).
    silver-grey surfaces, large bold headings, airy floating cards, ultra-soft
    diffused shadows, nested cards, eyebrow pill tags, generous whitespace,
    spring micro-motion, no harsh borders, no dark drop shadows.

  HOW TO USE
    1. Edit the SECTIONS config to name/order the sections you want (customizable).
    2. Replace the WEEKS and LEXICON assignments with your real JSON (see
       references/data-schema.md). Replace the WHOLE assignment line, do not leave
       a trailing `[]`.
    3. Set the REPORT_TITLE and RECURRING_WINDOW constants.
    4. Save as customer-intelligence-report-YYYY-MM-DD.html and open it.
    5. Never invent numbers or quotes. Every figure traces to a real source result.
    6. No em dashes anywhere in the rendered copy.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Intelligence Report</title>
<style>
  :root{
    --bg:#eef0f4; --bg-2:#f6f7fa; --surface:#ffffff; --surface-sunken:#f1f3f7;
    --ink:#14161c; --ink-soft:#4a4f5c; --ink-faint:#878d9c; --hair:rgba(20,22,28,.06);
    --accent:#5b6cff; --accent-soft:rgba(91,108,255,.10);
    --shadow-lo:0 1px 2px rgba(20,22,28,.04),0 8px 24px rgba(20,22,28,.05);
    --shadow-hi:0 2px 6px rgba(20,22,28,.05),0 24px 60px rgba(20,22,28,.10);
    --r-lg:28px; --r-md:20px; --r-sm:14px;
    --ok:#2ea06a; --ok-soft:rgba(46,160,106,.12);
    --open:#ff8c42; --open-soft:rgba(255,140,66,.14);
    --hot:#ff4d4d; --warm:#ff8c42; --cool:#3b9dff; --cold:#9aa2b1;
    --font:"SF Pro Display","Segoe UI Variable","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0c10; --bg-2:#121319; --surface:#16181f; --surface-sunken:#101116;
      --ink:#f3f4f7; --ink-soft:#b9bec9; --ink-faint:#7c8393; --hair:rgba(255,255,255,.07);
      --accent:#8b97ff; --accent-soft:rgba(139,151,255,.14);
      --shadow-lo:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
      --shadow-hi:0 2px 6px rgba(0,0,0,.45),0 28px 70px rgba(0,0,0,.55);
      --ok-soft:rgba(46,160,106,.2); --open-soft:rgba(255,140,66,.2);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0c10; --bg-2:#121319; --surface:#16181f; --surface-sunken:#101116;
    --ink:#f3f4f7; --ink-soft:#b9bec9; --ink-faint:#7c8393; --hair:rgba(255,255,255,.07);
    --accent:#8b97ff; --accent-soft:rgba(139,151,255,.14);
    --shadow-lo:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-hi:0 2px 6px rgba(0,0,0,.45),0 28px 70px rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    --bg:#eef0f4; --bg-2:#f6f7fa; --surface:#ffffff; --surface-sunken:#f1f3f7;
    --ink:#14161c; --ink-soft:#4a4f5c; --ink-faint:#878d9c; --hair:rgba(20,22,28,.06);
    --accent:#5b6cff; --accent-soft:rgba(91,108,255,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    font-family:var(--font);color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%,var(--accent-soft),transparent 60%),
      radial-gradient(1000px 500px at 100% 0%,rgba(120,200,255,.10),transparent 55%),
      linear-gradient(180deg,var(--bg-2),var(--bg));
    background-attachment:fixed;min-height:100dvh;padding:clamp(20px,4vw,56px);line-height:1.5;
  }
  .wrap{max-width:1180px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--shadow-lo);padding:clamp(20px,2.4vw,32px);transition:transform .6s cubic-bezier(.32,.72,0,1),box-shadow .6s cubic-bezier(.32,.72,0,1)}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);background:var(--surface-sunken);border:1px solid var(--hair);padding:6px 14px;border-radius:999px}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  header{margin-bottom:clamp(24px,3.5vw,40px)}
  header .titlerow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:20px}
  h1{font-size:clamp(32px,5.5vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1}
  header .meta{text-align:right;color:var(--ink-soft);font-size:14px}
  header .meta strong{display:block;color:var(--ink);font-size:16px;font-weight:600}
  .nav{display:flex;align-items:center;gap:10px;margin-top:16px}
  .nav button{font-family:var(--font);font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow-lo);border-radius:999px;padding:9px 16px;cursor:pointer;transition:transform .4s cubic-bezier(.32,.72,0,1),box-shadow .4s}
  .nav button:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-hi)}
  .nav button:disabled{opacity:.4;cursor:not-allowed}
  .nav .period{font-size:14px;font-weight:600;color:var(--ink-soft);padding:0 6px}
  .themetoggle{margin-left:auto}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.6vw,20px);margin-bottom:clamp(20px,3vw,32px)}
  .kpi{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--shadow-lo);padding:22px 24px;position:relative;overflow:hidden}
  .kpi .n{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.02em}
  .kpi .l{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
  .kpi .spark{position:absolute;right:-6px;bottom:-10px;font-size:64px;opacity:.06;font-weight:800}
  .section{margin-bottom:clamp(20px,3vw,32px)}
  .section-title{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .section-title h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .section-title .count{margin-left:auto;font-size:13px;color:var(--ink-faint);background:var(--surface-sunken);padding:4px 12px;border-radius:999px;border:1px solid var(--hair)}
  .themegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,1.8vw,20px)}
  .theme{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--shadow-lo);padding:22px 24px;display:flex;flex-direction:column;gap:12px;transition:transform .6s cubic-bezier(.32,.72,0,1),box-shadow .6s}
  .theme:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
  .theme .thead{display:flex;align-items:flex-start;gap:10px}
  .theme .title{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25;flex:1}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--hair);white-space:nowrap}
  .badge.streak{color:var(--accent);background:var(--accent-soft)}
  .badge.resolved{color:var(--ok);background:var(--ok-soft)}
  .badge.open{color:var(--open);background:var(--open-soft)}
  .badge.freq{color:var(--ink-soft);background:var(--surface-sunken)}
  .theme .summary{font-size:14px;color:var(--ink-soft);line-height:1.55}
  .theme .members{font-size:12.5px;color:var(--ink-faint)}
  .theme .members b{color:var(--ink-soft);font-weight:600}
  .evidence{border-top:1px solid var(--hair);padding-top:12px;display:flex;flex-direction:column;gap:10px}
  .quote{background:var(--surface-sunken);border:1px solid var(--hair);border-radius:var(--r-sm);padding:11px 13px;box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
  @media (prefers-color-scheme: dark){.quote{box-shadow:inset 0 1px 1px rgba(255,255,255,.05)}}
  .quote .q{font-size:13px;color:var(--ink);line-height:1.5;font-style:italic}
  .quote .src{margin-top:6px;font-size:11px;color:var(--ink-faint);display:flex;align-items:center;gap:6px}
  .src .tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--hair)}
  .tag.fireflies{color:#c26a2b;background:rgba(194,106,43,.12)}
  .tag.circle{color:#7a5cff;background:rgba(122,92,255,.12)}
  .tag.other{color:var(--ink-soft);background:var(--surface-sunken)}
  .stuck{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair)}
  .stuck:last-child{border-bottom:0}
  .stuck .wk{font-size:22px;font-weight:800;color:var(--open);min-width:44px;text-align:center}
  .stuck .wk small{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .stuck .who b{display:block;font-size:14px}
  .stuck .who span{font-size:12.5px;color:var(--ink-soft)}
  .empty{font-size:13.5px;color:var(--ink-faint);padding:8px 0}
  footer{margin-top:clamp(32px,5vw,56px);text-align:center;color:var(--ink-faint);font-size:12.5px;letter-spacing:.02em}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.themegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow"><span class="dot"></span><span id="eyebrow">CUSTOMER INTELLIGENCE</span></span>
    <div class="titlerow">
      <h1 id="title">Customer Intelligence Report</h1>
      <div class="meta"><strong id="scope"></strong><span id="subtitle"></span></div>
    </div>
    <div class="nav">
      <button id="prev">&larr; Previous</button>
      <span class="period" id="period"></span>
      <button id="next">Next &rarr;</button>
      <button class="themetoggle" id="themetoggle">Toggle theme</button>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div id="sections"></div>
  <footer id="footer"></footer>
</div>

<script>
/* =========================================================================
   CONFIG  -  edit these to customize the report (see references/report-config.md)
   ========================================================================= */
const REPORT_TITLE   = "Customer Intelligence Report"; // FILL
const REPORT_EYEBROW = "CUSTOMER INTELLIGENCE";        // FILL: scope tag, e.g. "TEAM DELTA - WEEKLY"
const REPORT_SCOPE   = "";                             // FILL: e.g. "All meetings" / "Sarah Chen" / "Sales team"
const REPORT_SOURCES = "Fireflies meetings + Circle posts";// FILL: sources analyzed
const RECURRING_WINDOW = 4; // how many trailing periods count toward "recurring"

// Section catalog. Order here = render order. Add/rename freely; any theme whose
// `section` matches an `id` renders under that section. Themes with an unknown
// section still render under an auto-created "Other" section so nothing is lost.
const SECTIONS = [
  { id: "pain-points",  title: "Pain points" },
  { id: "tech-patterns", title: "Technical patterns" }
  // e.g. add: { id: "feature-requests", title: "Feature requests" }
];

/* =========================================================================
   DATA  -  replace both assignments with real JSON (see references/data-schema.md)
   ========================================================================= */
let WEEKS = [/* FILL: array of period objects, oldest first */];
let LEXICON = [/* FILL: controlled vocabulary entries */];

/* =========================================================================
   RENDER  -  no need to edit below this line
   ========================================================================= */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { const p=String(d||"").split("-"); if(p.length!==3) return esc(d); const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return `${+p[2]} ${m[+p[1]-1]} ${p[0]}`; };
const fmtRange = (a,b) => `${fmtDate(a)} to ${fmtDate(b)}`;
const srcTag = s => s==="fireflies"?"fireflies":s==="circle"?"circle":"other";

let currentIdx = WEEKS.length - 1; // start on newest

function recurringThemes(uptoIdx){
  // themes appearing in >= 2 of the trailing RECURRING_WINDOW periods, ranked by streak then frequency
  const start = Math.max(0, uptoIdx - RECURRING_WINDOW + 1);
  const seen = new Map();
  for(let i=start;i<=uptoIdx;i++){
    (WEEKS[i]?.themes||[]).forEach(t=>{
      const cur = seen.get(t.id) || {theme:t, periods:0, freq:0};
      cur.periods += 1; cur.freq += (t.frequency||0); cur.theme = t; // keep latest
      seen.set(t.id, cur);
    });
  }
  return [...seen.values()].filter(x=>x.periods>=2)
    .sort((a,b)=>(b.theme.streak||0)-(a.theme.streak||0)||b.freq-a.freq)
    .map(x=>x.theme);
}

function themeCard(t){
  const badges = [];
  if((t.streak||0)>=2) badges.push(`<span class="badge streak">${esc(t.streak)}w streak</span>`);
  badges.push(`<span class="badge freq">${esc((t.calls_count||0))} calls${(t.posts_count?` · ${esc(t.posts_count)} posts`:"")}</span>`);
  badges.push(t.resolved?`<span class="badge resolved">Resolved</span>`:`<span class="badge open">Open</span>`);
  const members = (t.members&&t.members.length)?`<div class="members"><b>Raised by:</b> ${t.members.map(esc).join(", ")}</div>`:"";
  const evidence = (t.evidence&&t.evidence.length)?`<div class="evidence">${t.evidence.map(e=>`
      <div class="quote"><div class="q">${esc(e.quote)}</div>
        <div class="src"><span class="tag ${srcTag(e.source)}">${esc(e.source||"source")}</span>${esc(e.member||"")}</div></div>`).join("")}</div>`:"";
  return `<div class="theme">
    <div class="thead"><div class="title">${esc(t.title)}</div></div>
    <div class="badges">${badges.join("")}</div>
    <div class="summary">${esc(t.summary)}</div>
    ${members}${evidence}
  </div>`;
}

function sectionBlock(title, themes, countLabel){
  const body = themes.length
    ? `<div class="themegrid">${themes.map(themeCard).join("")}</div>`
    : `<div class="empty">No ${esc(title.toLowerCase())} this period.</div>`;
  return `<div class="section"><div class="section-title"><h2>${esc(title)}</h2>
    <span class="count">${esc(countLabel!=null?countLabel:themes.length)}</span></div>${body}</div>`;
}

function render(){
  const w = WEEKS[currentIdx];
  document.getElementById("title").textContent = REPORT_TITLE;
  document.getElementById("eyebrow").textContent = REPORT_EYEBROW;
  document.getElementById("scope").textContent = REPORT_SCOPE || "";
  document.getElementById("subtitle").textContent = REPORT_SOURCES;
  document.title = REPORT_TITLE;

  if(!w){ document.getElementById("sections").innerHTML = `<div class="card"><div class="empty">No data for this period.</div></div>`; return; }
  document.getElementById("period").textContent = `${w.week_of_month?w.week_of_month+" · ":""}${fmtRange(w.week_start,w.week_end)}`;
  document.getElementById("prev").disabled = currentIdx<=0;
  document.getElementById("next").disabled = currentIdx>=WEEKS.length-1;

  // KPIs
  const themes = w.themes||[];
  const recurring = recurringThemes(currentIdx);
  const kpis = [
    {n:w.calls_processed||0, l:"Meetings analyzed", s:"🎙️"},
    {n:themes.length, l:"Themes surfaced", s:"🧩"},
    {n:recurring.length, l:`Recurring (${RECURRING_WINDOW}p)`, s:"🔁"},
    {n:(w.stuck_members||[]).length, l:"Members to help", s:"🚧"}
  ];
  if(w.posts_processed){ kpis[0] = {n:(w.calls_processed||0), l:"Meetings analyzed", s:"🎙️"}; }
  document.getElementById("kpis").innerHTML = kpis.map(k=>`<div class="kpi"><div class="n">${esc(k.n)}</div><div class="l">${esc(k.l)}</div><div class="spark">${k.s}</div></div>`).join("");

  // Sections: recurring first, then each configured section, then any unknown-section themes, then stuck members
  let html = "";
  html += sectionBlock(`Recurring themes (last ${RECURRING_WINDOW} periods)`, recurring, recurring.length);
  const known = new Set(SECTIONS.map(s=>s.id));
  SECTIONS.forEach(sec=>{
    html += sectionBlock(sec.title, themes.filter(t=>t.section===sec.id));
  });
  const orphans = themes.filter(t=>!known.has(t.section));
  if(orphans.length) html += sectionBlock("Other", orphans);

  const stuck = w.stuck_members||[];
  const stuckBody = stuck.length
    ? stuck.slice().sort((a,b)=>(b.weeks_stuck||0)-(a.weeks_stuck||0)).map(s=>`
        <div class="stuck"><div class="wk">${esc(s.weeks_stuck||0)}<small>weeks</small></div>
          <div class="who"><b>${esc(s.member)}</b><span>Stuck on: ${esc(s.theme)}${s.first_seen?` · since ${fmtDate(s.first_seen)}`:""}</span></div></div>`).join("")
    : `<div class="empty">No members flagged as stuck this period.</div>`;
  html += `<div class="section card"><div class="section-title"><h2>Members to help</h2><span class="count">${stuck.length}</span></div>${stuckBody}</div>`;

  document.getElementById("sections").innerHTML = html;
  document.getElementById("footer").textContent = `Generated by the Customer Intelligence Report skill · source: ${REPORT_SOURCES} · ${WEEKS.length} periods tracked`;
}

document.getElementById("prev").onclick = ()=>{ if(currentIdx>0){currentIdx--;render();} };
document.getElementById("next").onclick = ()=>{ if(currentIdx<WEEKS.length-1){currentIdx++;render();} };
document.getElementById("themetoggle").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", isDark?"light":"dark");
};
render();
</script>
</body>
</html>
